[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piano-sheet"
version = "0.1.0"
description = "Transforme un enregistrement de piano (MP3, WAV...) en partition (MusicXML, MIDI)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "music21>=9.1",
    "mido>=1.3",
    "torch>=2.0",
    "piano_transcription_inference>=0.0.6",
    "torchlibrosa>=0.1.0",
    # Imported unconditionally by piano_transcription_inference but no longer
    # pulled in by recent librosa releases.
    "audioread>=3.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
piano-sheet = "piano_sheet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
piano_sheet = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: needs the transcription model checkpoint (skipped when absent)",
]
